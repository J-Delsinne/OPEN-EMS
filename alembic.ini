[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Placeholder URL — overridden by the migration runner at startup via env.py
sqlalchemy.url = sqlite:///open_ems.db

# [loggers]/[handlers]/[formatters] sections are intentionally omitted.
# fileConfig() is disabled in env.py to prevent stdlib log reconfiguration
# from conflicting with structlog JSON output.
