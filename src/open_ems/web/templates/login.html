<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — OPEN-EMS</title>
  <style>
    :root {
      --color-surface: #f8fafc;
      --color-card: #ffffff;
      --color-border: #e2e8f0;
      --color-text-primary: #1e293b;
      --color-text-secondary: #64748b;
      --color-error: #dc2626;
      --font-sans: system-ui, -apple-system, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--color-surface);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 1rem; }
    label span {
      display: block;
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      margin-bottom: 0.375rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
    .error {
      color: var(--color-error);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.75rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 0.625rem;
      background: #1e293b;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    button[type="submit"]:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OPEN-EMS</h1>
    <form method="POST" action="/login{% if next %}?next={{ next | urlencode }}{% endif %}">
      {% if error %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}
      <label>
        <span>Username</span>
        <input type="text" name="username" value="{{ username }}" required autofocus
               autocomplete="username">
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <!-- CSRF token: Story 2.4 -->
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
